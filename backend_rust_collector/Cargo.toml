[package]
name = "backend_rust_collector"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.33"
reqwest = { version = "0.13.4", features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.24.0", features = ["native-tls"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
zip = "2.2.3"
