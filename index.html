<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>QuantaAI — Market Data & AI Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <body class="bg-[#0B0E14] text-gray-200">
    <div id="root">
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0B0E14; color: #E2E8F0; font-family: 'Inter', sans-serif;">
        <div style="display: flex; align-items: center; gap: 12px; background-color: #0F1117; padding: 16px 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);">
          <div style="width: 20px; height: 20px; border: 3px solid #2962FF; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
          <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #94A3B8;">Initializing QuantaAI Engine...</div>
        </div>
      </div>
    </div>
